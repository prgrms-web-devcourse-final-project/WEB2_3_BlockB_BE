name: Earthtalk Backend Dev Server CI/CD

on:
  push:
    branches: [ "develop" ] # develop 브랜치에 푸시되었을 때 실행

permissions:
  contents: read

jobs:
  # Spring Boot 애플리케이션을 빌드하여 도커허브에 푸시하는 과정
  build-docker-image:
    runs-on: ubuntu-latest
    steps:
      # 1. submodule 설정
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.SUBMODULE_TOKEN }}
          submodules: true
            
      # 2. Java 17 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        shell: bash

      # 3. Spring Boot 애플리케이션 빌드
      - name: Build with Gradle
        run: ./gradlew bootJar
        shell: bash

      # 4. Docker 이미지 빌드
      - name: Docker image build
        run: docker build --platform linux/amd64 -t ${{ secrets.DOCKERHUB_USERNAME }}/earthtalk:latest .

      # 5. DockerHub 로그인
      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Docker Hub 이미지 빌드/푸시
      - name: Docker Hub push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/earthtalk:latest

  # 7. 배포
  run-docker-image:
    needs: build-docker-image
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_DEV }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        port: 22
        script: |
          docker stop earthtalk && docker rm earthtalk && docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/earthtalk:latest
          docker run -d -p 8080:8080 -p 8443:8443 -v /etc/letsencrypt/live/earthtalk.shop/keystore.p12:/etc/letsencrypt/live/earthtalk.shop/keystore.p12 --name earthtalk ${{ secrets.DOCKERHUB_USERNAME }}/earthtalk:latest
